<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Canal & River Trust Study Guide</title>
    <style>
        /* --- ORIGINAL VARIABLES & BASE STYLES --- */
        :root{ --water-hero:#1e29f5; --deep-water:#00416e; --sky:#33d8ff; --white:#ffffff; --leaf:#0a4f6b; --poppy:#e64f00; --bg:var(--deep-water); --panel:var(--water-hero); --chrome:var(--sky); --accent:var(--poppy); --text:var(--white); }
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh; overflow: hidden;}
        
        .jukebox { position:relative; width:1024px; height:700px; background:linear-gradient(180deg,var(--panel),var(--deep-water)); border-radius:24px; overflow:hidden; display:grid; grid-template-rows:auto 1fr; box-shadow:0 20px 60px rgba(0,0,0,.6), inset 0 0 0 8px var(--sky) }
        @media (max-width: 1040px) { .jukebox { width: 95vw; } }
        @media (max-height: 720px) { .jukebox { height: 95vh; } }
        
        .header { background:var(--deep-water); border-bottom:1px solid var(--sky); padding:10px 14px; font-weight:700; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 20; }
        .crt-logo { height: 20px; width: auto; display: block; }
        
        /* Layout Structure */
        .content { display: flex; gap: 20px; padding: 18px; height: 100%; min-height: 0; min-width: 0; }
        .left { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; overflow: hidden; }
        .right { width: 380px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
        
        .panel{flex:1; background:linear-gradient(180deg,var(--water-hero),var(--deep-water));border:1px solid var(--sky);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
        .panel h3{margin:0;background:var(--deep-water);border-bottom:1px solid var(--sky);padding:10px;font-weight:700}
        .scrollable{flex:1;overflow:auto;min-height:0; padding-bottom: 10px;}
        
        .row{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid rgba(255,255,255,.12); cursor: pointer;}
        .row:hover, .row.active { background:var(--leaf); }
        .trash { background: none; border: none; color: #ff8e52; cursor: pointer; font-size: 1.1rem; margin-left: auto;}
        .trash:hover { color: var(--poppy); }
        
        /* --- MEDIA AREA: THE "TV SCREEN" FIX --- */
        .cover-wrapper { 
            flex: 1; 
            min-height: 0; 
            min-width: 0; 
            background: #000; /* Black background for the "screen" */
            border-radius: 14px; 
            box-shadow: 0 12px 28px rgba(0,0,0,0.45); 
            overflow: hidden; /* Nothing can bleed outside the rounded corners */
            display: flex; 
            position: relative;
        }
        
        #coverContainer { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        
        /* Images and videos are forced to 100% of the wrapper and told to fit themselves inside */
        .cover { width: 100%; height: 100%; object-fit: contain; display: block; }
        
        #videoPlayer, #ytPlayer { display: none; width: 100%; height: 100%; border: none; object-fit: contain; background: #000; }
        
        .default-cover { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; background: var(--deep-water); color: var(--sky); font-size: 1.1rem; text-align: center; padding: 20px; box-sizing: border-box;}
        /* -------------------------------------- */
        
        /* Ticker & Controls */
        #ticker{ white-space:nowrap; overflow:hidden; border-top:1px solid var(--sky); border-bottom:1px solid var(--sky); min-height:34px; display:flex; align-items:center; padding:4px 10px; width: 100%; max-width: 100%; flex-shrink: 0; box-sizing: border-box; }
        #ticker span{display:inline-block;padding-left:100%;animation:scroll-left 80s linear infinite}
        @keyframes scroll-left{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
        
        .controls{display:flex;justify-content:center;align-items:center;gap:10px; width: 100%; flex-wrap: wrap; flex-shrink: 0;}
        .btn{background:linear-gradient(180deg,var(--sky),var(--water-hero));color:#fff;border:1px solid var(--chrome);border-radius:12px;padding:8px 14px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)}
        .btn:hover{filter:brightness(1.1)}
        .btn[disabled]{opacity:.5;cursor:not-allowed}
        .btn-pdf { background: linear-gradient(180deg, var(--poppy), #8a2f00); border-color: #ff8e52; }
        .btn-folder { background: linear-gradient(180deg, #10b981, #047857); border-color: #34d399; }
        .btn-settings { background: transparent; border: 1px solid var(--sky); color: var(--sky); border-radius: 6px; padding: 4px 8px; cursor: pointer; }

        /* Settings Modal (CRUD) */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: var(--deep-water); border: 2px solid var(--sky); border-radius: 14px; padding: 25px; width: 95%; max-width: 600px; max-height: 90vh; overflow-y: auto; position: relative;}
        .modal-content h2 { margin-top: 0; color: var(--sky); display: flex; justify-content: space-between; align-items: center;}
        .close-modal { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--sky); font-weight: 600;}
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--sky); background: rgba(0,0,0,0.2); color: white; }
        .flex-buttons { display: flex; gap: 10px; margin-top: 20px; }
        
        hr { border-color: rgba(255,255,255,0.1); margin: 20px 0;}
        
        .settings-view { display: none; }
        .settings-view.active { display: block; }
        
        .list-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 12px; margin-bottom: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .list-item-title { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 10px;}
        .list-actions { display: flex; gap: 6px; }
        .btn-sm { padding: 4px 8px; font-size: 0.8rem; border-radius: 6px; border: 1px solid var(--sky); background: transparent; color: white; cursor: pointer;}
        .btn-sm.edit { background: var(--leaf); border-color: #10b981;}
        .btn-sm.delete { background: #991b1b; border-color: #f87171;}
        .btn-sm.manage { background: var(--water-hero); border-color: var(--sky);}
        .btn-sm.queue { background: transparent; border: 1px solid var(--sky); color: var(--sky); }
        .btn-sm.queue:hover { background: var(--sky); color: var(--deep-water); }
    </style>
</head>
<body>

<div class="jukebox">
    <div class="header">
        <span>CanalCast Study Guide</span>
        <button class="btn-settings" onclick="openSettings()">⚙ Settings & Backup</button>
    </div>
    
    <div class="content">
        <section class="left">
            <div class="cover-wrapper">
                <div id="coverContainer">
                    <div class="default-cover">Select a module and queue a session</div>
                </div>
                <video id="videoPlayer" controls></video>
                <iframe id="ytPlayer" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
            </div>
            <div id="ticker"><span>—</span></div>
            <div class="controls">
                <button class="btn" id="playPauseBtn" type="button" disabled>▶ Play</button>
                <button class="btn" id="skipBtn" type="button" disabled>⏭ Skip</button>
                <button class="btn btn-pdf" id="pdfBtn" type="button" style="display:none;" onclick="openPDF()">📖 Study Guide</button>
                <button class="btn btn-folder" id="folderBtn" type="button" style="display:none;" onclick="openFolder()">📁 Resources</button>
            </div>
        </section>
        
        <section class="right">
            <div class="panel">
                <h3>Study Modules</h3>
                <div id="moduleList" class="scrollable"></div>
            </div>
            <div class="panel">
                <h3>Sessions</h3>
                <div id="sessionList" class="scrollable"></div>
            </div>
            <div class="panel">
                <h3>Play Queue</h3>
                <div id="queueList" class="scrollable"></div>
            </div>
        </section>
    </div>
</div>

<!-- Settings Modal -->
<div class="modal" id="settingsModal">
    <div class="modal-content">
        
        <!-- View 1: Module List -->
        <div id="view-modules" class="settings-view active">
            <h2>Manage Modules <button class="close-modal" onclick="closeSettings()">×</button></h2>
            <button class="btn" onclick="openModuleForm()">+ Add New Module</button>
            <hr>
            <div id="adminModuleList"></div>
            <hr>
            <h3>Backup & Restore</h3>
            <div class="flex-buttons" style="margin-top: 10px;">
                <button class="btn" style="font-size:0.85rem;" onclick="exportData()">⬇ Export Backup</button>
                <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
                <button class="btn" style="font-size:0.85rem;" onclick="document.getElementById('importFile').click()">⬆ Import Backup</button>
            </div>
        </div>

        <!-- View 2: Module Form -->
        <div id="view-module-form" class="settings-view">
            <h2 id="modFormTitle">Add Module</h2>
            <input type="hidden" id="formModId">
            <div class="form-group">
                <label>Module Title</label>
                <input type="text" id="formModTitle" placeholder="e.g. History of UK Canals">
            </div>
            <div class="form-group">
                <label>Module Cover Image URL</label>
                <input type="text" id="formModCover" placeholder="Dropbox, SharePoint, URL...">
            </div>
            <div class="form-group">
                <label>Study Guide PDF URL (For the whole module)</label>
                <input type="text" id="formModPdf" placeholder="Link to the main PDF">
            </div>
            <div class="form-group">
                <label>Resources Folder URL</label>
                <input type="text" id="formModFolder" placeholder="Link to SharePoint/Dropbox folder">
            </div>
            <div class="flex-buttons">
                <button class="btn" onclick="saveModule()">Save Module</button>
                <button class="btn" style="background:var(--poppy)" onclick="switchView('view-modules')">Cancel</button>
            </div>
        </div>

        <!-- View 3: Session List (For a specific module) -->
        <div id="view-sessions" class="settings-view">
            <h2>Sessions for: <span id="adminSessionModTitle" style="color:#fff; font-size:1.1rem; margin-left:10px;"></span></h2>
            <div class="flex-buttons" style="margin-top:0; margin-bottom:15px;">
                <button class="btn" onclick="openSessionForm()">+ Add Session</button>
                <button class="btn" style="background:var(--leaf)" onclick="switchView('view-modules')">⬅ Back to Modules</button>
            </div>
            <div id="adminSessionList"></div>
        </div>

        <!-- View 4: Session Form -->
        <div id="view-session-form" class="settings-view">
            <h2 id="sesFormTitle">Add Session</h2>
            <input type="hidden" id="formSesId">
            <div class="form-group">
                <label>Session Title</label>
                <input type="text" id="formSesTitle" placeholder="e.g. Episode 1">
            </div>
            <div class="form-group">
                <label>Session Cover Image URL (Optional)</label>
                <input type="text" id="formSesCover">
            </div>
            <div class="form-group">
                <label>Ticker Description</label>
                <input type="text" id="formSesTicker" placeholder="Text to scroll while playing">
            </div>
            <div class="form-group">
                <label>Media Type</label>
                <select id="formSesType">
                    <option value="audio">Audio / Podcast</option>
                    <option value="video">Video (MP4 or YouTube)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Media File URL</label>
                <input type="text" id="formSesMediaUrl" placeholder="Dropbox MP4/MP3 or YouTube Link">
            </div>
            <div class="flex-buttons">
                <button class="btn" onclick="saveSession()">Save Session</button>
                <button class="btn" style="background:var(--poppy)" onclick="switchView('view-sessions')">Cancel</button>
            </div>
        </div>

    </div>
</div>

<script>
    // --- UTILITIES ---
    function directLink(url, isMedia = true){
        if(!url) return '';
        if(!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
        try{
            const u = new URL(url);
            if(u.hostname.includes('dropbox.com')){
                if(isMedia) {
                    u.searchParams.set('dl','1');
                    return u.toString().replace('https://urldefense.com/v3/__http://www.dropbox.com__;!!LHav0979W1rwZ6kzRg!8pXT0zA8bRaXIj4vTg8iO5cIe8fjr4UvzB9BBT9rvE5IM5VMgj25ww0zQpAMldOZbeCIRK40-kpCvL1gc2SjRnwhXlA$','dl.dropboxusercontent.com');
                } else {
                    u.searchParams.set('dl','0');
                    return u.toString();
                }
            }
            if(u.hostname.includes('sharepoint.com')){
                if(isMedia) {
                    u.searchParams.delete('web'); 
                    u.searchParams.set('download','1');
                } else {
                    u.searchParams.set('web','1');
                }
                return u.toString();
            }
        }catch(e){
            console.warn("URL Parsing Error:", e);
        }
        return url;
    }

    function getYouTubeId(url) {
        if(!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    function generateId() {
        return Math.random().toString(36).substr(2, 9);
    }

    // --- STATE MANAGEMENT ---
    let studyData = JSON.parse(localStorage.getItem('crtStudyDataV2')) || [];
    
    // Playback state
    let selectedModuleId = null;
    let currentSession = null;
    let queue = [];
    
    // Admin state
    let adminActiveModuleId = null; 

    // --- ELEMENTS ---
    const audio = new Audio();
    const video = document.getElementById('videoPlayer');
    const ytPlayer = document.getElementById('ytPlayer');
    const coverContainer = document.getElementById('coverContainer');
    const ticker = document.querySelector('#ticker span');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const skipBtn = document.getElementById('skipBtn');
    const pdfBtn = document.getElementById('pdfBtn');
    const folderBtn = document.getElementById('folderBtn');
    
    // --- MAIN APP RENDERING ---
    function saveData() {
        localStorage.setItem('crtStudyDataV2', JSON.stringify(studyData));
        renderAppModules();
        if (selectedModuleId) renderAppSessions();
    }

    function renderAppModules() {
        const list = document.getElementById('moduleList');
        list.innerHTML = '';
        if(studyData.length === 0) {
            list.innerHTML = '<div class="row" style="opacity:0.6">No modules yet. Add one in Settings.</div>';
        }
        studyData.forEach(mod => {
            const row = document.createElement('div');
            row.className = 'row' + (mod.id === selectedModuleId ? ' active' : '');
            
            let coverImg = mod.cover ? `<img src="${directLink(mod.cover, true)}" style="width:40px;height:40px;border-radius:6px;object-fit:cover; flex-shrink:0;">` : `<div style="width:40px;height:40px;border-radius:6px;background:var(--sky);display:flex;align-items:center;justify-content:center;color:var(--deep-water);font-weight:bold; flex-shrink:0;">M</div>`;
            
            row.innerHTML = `${coverImg} <div style="flex:1;font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${mod.title}</div>
                             <button class="btn-sm queue" title="Queue All">+ All</button>`;
            
            row.onclick = (e) => { 
                if(e.target.tagName === 'BUTTON') {
                    // Queue All button clicked
                    if(mod.sessions && mod.sessions.length > 0) {
                        const wasEmpty = queue.length === 0 && !currentSession;
                        mod.sessions.forEach(s => queue.push({moduleId: mod.id, sessionId: s.id}));
                        renderQueue();
                        if(wasEmpty) playNext();
                    }
                    return;
                }
                selectedModuleId = mod.id; 
                updateModuleButtons(mod);
                renderAppModules(); 
                renderAppSessions(); 
            };
            list.appendChild(row);
        });
    }

    function renderAppSessions() {
        const list = document.getElementById('sessionList');
        list.innerHTML = '';
        if(!selectedModuleId) return;
        
        const mod = studyData.find(m => m.id === selectedModuleId);
        if(!mod.sessions || mod.sessions.length === 0) {
            list.innerHTML = '<div class="row" style="opacity:0.6">No sessions in this module.</div>';
            return;
        }

        mod.sessions.forEach(ses => {
            const row = document.createElement('div');
            row.className = 'row' + (currentSession && currentSession.id === ses.id ? ' active' : '');
            
            let imgSource = ses.cover || mod.cover; 
            let coverImg = imgSource ? `<img src="${directLink(imgSource, true)}" style="width:40px;height:40px;border-radius:6px;object-fit:cover; flex-shrink:0;">` : `<div style="width:40px;height:40px;border-radius:6px;background:var(--leaf);display:flex;align-items:center;justify-content:center; flex-shrink:0;">🎵</div>`;

            row.innerHTML = `${coverImg} <div style="flex:1;font-size:0.9em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${ses.title}</div>`;
            row.onclick = () => addToQueue(mod.id, ses.id);
            list.appendChild(row);
        });
    }

    function renderQueue() {
        const qList = document.getElementById('queueList');
        qList.innerHTML = '';
        
        if(queue.length === 0) {
            qList.innerHTML = '<div class="row" style="opacity:0.6">Queue empty</div>';
            skipBtn.disabled = true;
        } else {
            skipBtn.disabled = false;
        }

        queue.forEach((qItem, i) => {
            const mod = studyData.find(m => m.id === qItem.moduleId);
            if(!mod) return;
            const ses = mod.sessions.find(s => s.id === qItem.sessionId);
            if(!ses) return;

            const row = document.createElement('div');
            row.className = 'row';
            let imgSource = ses.cover || mod.cover; 
            let coverImg = imgSource ? `<img src="${directLink(imgSource, true)}" style="width:40px;height:40px;border-radius:6px;object-fit:cover; flex-shrink:0;">` : `<div style="width:40px;height:40px;border-radius:6px;background:var(--leaf);display:flex;align-items:center;justify-content:center; flex-shrink:0;">🎵</div>`;

            row.innerHTML = `${coverImg} <div style="flex:1;font-size:0.9em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${ses.title}</div>
                             <button class="trash" title="Remove">🗑</button>`;
            
            row.querySelector('.trash').onclick = (e) => {
                e.stopPropagation();
                removeFromQueue(i);
            };
            qList.appendChild(row);
        });
    }

    function updateModuleButtons(mod) {
        pdfBtn.style.display = mod.pdfUrl ? 'block' : 'none';
        folderBtn.style.display = mod.folderUrl ? 'block' : 'none';
    }

    // --- QUEUE & MEDIA LOGIC ---
    function addToQueue(modId, sesId) {
        queue.push({ moduleId: modId, sessionId: sesId });
        renderQueue();
        if(!currentSession) {
            playNext();
        }
    }

    function removeFromQueue(index) {
        queue.splice(index, 1);
        renderQueue();
    }

    function playNext() {
        if(queue.length === 0) {
            currentSession = null;
            audio.pause(); video.pause(); ytPlayer.src = '';
            coverContainer.style.display = 'flex';
            coverContainer.innerHTML = `<div class="default-cover">Queue empty</div>`;
            video.style.display = 'none';
            ytPlayer.style.display = 'none';
            ticker.textContent = '—';
            playPauseBtn.disabled = true;
            playPauseBtn.innerHTML = '▶ Play';
            renderAppSessions();
            return;
        }
        
        const nextItem = queue.shift();
        renderQueue();
        
        const mod = studyData.find(m => m.id === nextItem.moduleId);
        if(!mod) return playNext();
        const ses = mod.sessions.find(s => s.id === nextItem.sessionId);
        if(!ses) return playNext();

        loadSession(ses, mod);
        renderAppSessions(); // update active state on list
        
        // Auto play logic
        if(ses.mediaType !== 'video' || !getYouTubeId(ses.mediaUrl)) {
            const media = ses.mediaType === 'video' ? video : audio;
            media.play().catch(e => console.warn("Autoplay blocked:", e));
        }
    }

    function loadSession(ses, mod) {
        currentSession = ses;
        audio.pause(); 
        video.pause();
        ytPlayer.src = '';
        
        ticker.textContent = ses.ticker || `${mod.title}: ${ses.title}`;
        playPauseBtn.disabled = false;
        playPauseBtn.innerHTML = '▶ Play';
        
        let coverSrc = directLink(ses.cover || mod.cover, true);

        // Reset display
        coverContainer.style.display = 'none';
        video.style.display = 'none';
        ytPlayer.style.display = 'none';

        if(ses.mediaType === 'video') {
            let ytId = getYouTubeId(ses.mediaUrl);
            if(ytId) {
                // YouTube video (?autoplay=1 handles autoplay)
                ytPlayer.style.display = 'block';
                ytPlayer.src = `https://urldefense.com/v3/__https://www.youtube.com/embed/$*7BytId*7D?autoplay=1__;JSU!!LHav0979W1rwZ6kzRg!8pXT0zA8bRaXIj4vTg8iO5cIe8fjr4UvzB9BBT9rvE5IM5VMgj25ww0zQpAMldOZbeCIRK40-kpCvL1gc2Sjc_Gj5_I$`;
                playPauseBtn.innerHTML = '▶ Playing YT';
            } else {
                // Direct MP4
                video.style.display = 'block';
                video.src = directLink(ses.mediaUrl, true);
            }
        } else {
            // Audio
            coverContainer.style.display = 'flex';
            if(coverSrc) {
                coverContainer.innerHTML = `<img src="${coverSrc}" class="cover">`;
            } else {
                coverContainer.innerHTML = `<div class="default-cover">${ses.title}</div>`;
            }
            audio.src = directLink(ses.mediaUrl, true);
        }

        // Make sure buttons refer to the currently playing module's resources
        updateModuleButtons(mod);
    }

    playPauseBtn.onclick = () => {
        if(!currentSession) {
            if(queue.length > 0) playNext();
            return;
        }
        
        if(currentSession.mediaType === 'video' && getYouTubeId(currentSession.mediaUrl)) {
            alert("Use the YouTube player controls on the video.");
            return;
        }

        const media = currentSession.mediaType === 'video' ? video : audio;
        if(media.paused) {
            media.play();
            playPauseBtn.innerHTML = 'II Pause';
        } else {
            media.pause();
            playPauseBtn.innerHTML = '▶ Play';
        }
    };

    skipBtn.onclick = () => {
        if(currentSession) {
            audio.pause();
            video.pause();
        }
        playNext();
    }

    // Auto-advance when media finishes
    audio.addEventListener('ended', playNext);
    video.addEventListener('ended', playNext);

    // Sync play/pause button state
    [audio, video].forEach(media => {
        media.addEventListener('play', () => { playPauseBtn.innerHTML = 'II Pause'; });
        media.addEventListener('pause', () => { playPauseBtn.innerHTML = '▶ Play'; });
    });

    function openPDF() {
        if(currentSession) {
            const mod = studyData.find(m => m.sessions.some(s => s.id === currentSession.id));
            if(mod && mod.pdfUrl) window.open(directLink(mod.pdfUrl, false), '_blank');
        } else if(selectedModuleId) {
            const mod = studyData.find(m => m.id === selectedModuleId);
            if(mod && mod.pdfUrl) window.open(directLink(mod.pdfUrl, false), '_blank');
        }
    }

    function openFolder() {
        if(currentSession) {
            const mod = studyData.find(m => m.sessions.some(s => s.id === currentSession.id));
            if(mod && mod.folderUrl) window.open(directLink(mod.folderUrl, false), '_blank');
        } else if(selectedModuleId) {
            const mod = studyData.find(m => m.id === selectedModuleId);
            if(mod && mod.folderUrl) window.open(directLink(mod.folderUrl, false), '_blank');
        }
    }

    // --- ADMIN / CRUD LOGIC ---
    function openSettings() { 
        document.getElementById('settingsModal').style.display = 'flex'; 
        switchView('view-modules');
    }
    
    function closeSettings() { 
        document.getElementById('settingsModal').style.display = 'none'; 
    }

    function switchView(viewId) {
        document.querySelectorAll('.settings-view').forEach(el => el.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');

        if(viewId === 'view-modules') renderAdminModules();
        if(viewId === 'view-sessions') renderAdminSessions();
    }

    // Module CRUD
    function renderAdminModules() {
        const list = document.getElementById('adminModuleList');
        list.innerHTML = '';
        studyData.forEach(mod => {
            list.innerHTML += `
                <div class="list-item">
                    <div class="list-item-title">${mod.title}</div>
                    <div class="list-actions">
                        <button class="btn-sm manage" onclick="manageSessions('${mod.id}')">Manage Sessions (${mod.sessions ? mod.sessions.length : 0})</button>
                        <button class="btn-sm edit" onclick="editModule('${mod.id}')">✏️ Edit</button>
                        <button class="btn-sm delete" onclick="deleteModule('${mod.id}')">🗑️</button>
                    </div>
                </div>
            `;
        });
    }

    function openModuleForm(id = null) {
        switchView('view-module-form');
        const isEdit = id !== null;
        document.getElementById('modFormTitle').innerText = isEdit ? 'Edit Module' : 'Add New Module';
        
        let mod = isEdit ? studyData.find(m => m.id === id) : {};
        document.getElementById('formModId').value = mod.id || '';
        document.getElementById('formModTitle').value = mod.title || '';
        document.getElementById('formModCover').value = mod.cover || '';
        document.getElementById('formModPdf').value = mod.pdfUrl || '';
        document.getElementById('formModFolder').value = mod.folderUrl || '';
    }
    
    function editModule(id) { openModuleForm(id); }

    function saveModule() {
        const id = document.getElementById('formModId').value || generateId();
        const mod = {
            id: id,
            title: document.getElementById('formModTitle').value,
            cover: document.getElementById('formModCover').value,
            pdfUrl: document.getElementById('formModPdf').value,
            folderUrl: document.getElementById('formModFolder').value,
            sessions: [] // Default empty, preserved below if editing
        };

        const existingIndex = studyData.findIndex(m => m.id === id);
        if(existingIndex >= 0) {
            mod.sessions = studyData[existingIndex].sessions; // preserve sessions
            studyData[existingIndex] = mod;
        } else {
            studyData.push(mod);
        }

        saveData();
        switchView('view-modules');
    }

    function deleteModule(id) {
        if(confirm("Are you sure you want to delete this module and ALL its sessions?")) {
            studyData = studyData.filter(m => m.id !== id);
            if(selectedModuleId === id) { selectedModuleId = null; currentSession = null; queue = []; renderQueue(); }
            saveData();
            renderAdminModules();
        }
    }

    // Session CRUD
    function manageSessions(modId) {
        adminActiveModuleId = modId;
        const mod = studyData.find(m => m.id === modId);
        document.getElementById('adminSessionModTitle').innerText = mod.title;
        switchView('view-sessions');
    }

    function renderAdminSessions() {
        const list = document.getElementById('adminSessionList');
        list.innerHTML = '';
        const mod = studyData.find(m => m.id === adminActiveModuleId);
        if(!mod || !mod.sessions) return;

        mod.sessions.forEach(ses => {
            list.innerHTML += `
                <div class="list-item">
                    <div class="list-item-title">${ses.title} (${ses.mediaType})</div>
                    <div class="list-actions">
                        <button class="btn-sm edit" onclick="editSession('${ses.id}')">✏️ Edit</button>
                        <button class="btn-sm delete" onclick="deleteSession('${ses.id}')">🗑️</button>
                    </div>
                </div>
            `;
        });
    }

    function openSessionForm(id = null) {
        switchView('view-session-form');
        const isEdit = id !== null;
        document.getElementById('sesFormTitle').innerText = isEdit ? 'Edit Session' : 'Add New Session';
        
        const mod = studyData.find(m => m.id === adminActiveModuleId);
        let ses = isEdit ? mod.sessions.find(s => s.id === id) : { mediaType: 'audio' };
        
        document.getElementById('formSesId').value = ses.id || '';
        document.getElementById('formSesTitle').value = ses.title || '';
        document.getElementById('formSesCover').value = ses.cover || '';
        document.getElementById('formSesTicker').value = ses.ticker || '';
        document.getElementById('formSesType').value = ses.mediaType || 'audio';
        document.getElementById('formSesMediaUrl').value = ses.mediaUrl || '';
    }

    function editSession(id) { openSessionForm(id); }

    function saveSession() {
        const mod = studyData.find(m => m.id === adminActiveModuleId);
        const id = document.getElementById('formSesId').value || generateId();
        
        const ses = {
            id: id,
            title: document.getElementById('formSesTitle').value,
            cover: document.getElementById('formSesCover').value,
            ticker: document.getElementById('formSesTicker').value,
            mediaType: document.getElementById('formSesType').value,
            mediaUrl: document.getElementById('formSesMediaUrl').value
        };

        if(!mod.sessions) mod.sessions = [];
        
        const existingIndex = mod.sessions.findIndex(s => s.id === id);
        if(existingIndex >= 0) {
            mod.sessions[existingIndex] = ses;
        } else {
            mod.sessions.push(ses);
        }

        saveData();
        switchView('view-sessions');
    }

    function deleteSession(id) {
        if(confirm("Delete this session?")) {
            const mod = studyData.find(m => m.id === adminActiveModuleId);
            mod.sessions = mod.sessions.filter(s => s.id !== id);
            
            // Clean up queue if deleted item was in it
            queue = queue.filter(q => q.sessionId !== id);
            renderQueue();

            saveData();
            renderAdminSessions();
        }
    }

    // --- BACKUP LOGIC ---
    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(studyData));
        const anchor = document.createElement('a');
        anchor.setAttribute("href", dataStr);
        anchor.setAttribute("download", "canalcast_backup.json");
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
    }

    function importData(event) {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                studyData = JSON.parse(e.target.result);
                saveData();
                alert('Data imported successfully!');
                renderAdminModules();
            } catch(err) {
                alert('Invalid backup file.');
            }
        };
        reader.readAsText(file);
        event.target.value = ''; // reset input
    }

    // Start
    renderAppModules();
    renderQueue();

</script>
</body>
</html>
